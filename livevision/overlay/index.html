<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>HUDstream — Skyrim HUD overlay</title>
<!-- Skyrim's HUD face is Futura Condensed. macOS ships it (Futura → Condensed
     Medium); Barlow Condensed is the closest free fallback elsewhere. -->
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;500;600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="./styles.css" />
<!-- three.js + three-vrm are vendored so OBS never waits on a CDN mid-stream -->
<script type="importmap">
{ "imports": { "three": "./vendor/three/three.module.min.js",
               "three/addons/": "./vendor/three/addons/" } }
</script>
</head>
<body>
  <!-- ============================ compass ============================ -->
  <div id="compass-wrap">
    <canvas id="compass" width="900" height="84"></canvas>
  </div>

  <!-- ============================ objective line ====================== -->
  <div id="objective" class="hidden"></div>

  <!-- ============================ skill increase + level meter ======== -->
  <div id="skillup" class="hidden">
    <div class="su-text"></div>
    <div class="su-meter">
      <span class="su-lvl">Level <b id="su-lvlnum">1</b></span>
      <div class="meter"><i id="su-fill"></i></div>
    </div>
  </div>

  <!-- ============================ level up ============================ -->
  <div id="levelup" class="hidden"></div>

  <!-- ============================ location discovered ================= -->
  <div id="discover" class="hidden">
    <div class="dc-name"></div>
    <div class="dc-sub"><span class="rule"></span>Discovered<span class="rule"></span></div>
  </div>

  <!-- ============================ crosshair ============================ -->
  <div id="crosshair">
    <svg viewBox="-20 -10 40 20" width="40" height="20" aria-hidden="true">
      <path d="M-14 -5 L-7 0 L-14 5" />
      <path d="M14 -5 L7 0 L14 5" />
    </svg>
  </div>

  <!-- ============================ skill list (opt-in: ?skills=1) ====== -->
  <div id="left-stack">
    <div id="skills"></div>
  </div>

  <!-- ============================ vitals ============================== -->
  <!-- One bar: Skyrim's magicka (bottom left) showing the glasses' battery,
       relayed by the phone. Hidden until a reading arrives. -->
  <div id="vitals">
    <div class="vital unknown" data-vital="magicka" aria-label="glasses battery">
      <div class="bar"><div class="track"><div class="fill"></div></div></div>
    </div>
  </div>
  <!-- Heart rate (Apple Watch) just above the Magicka bar: beats at the
       measured rate; fades out when the Watch goes quiet. -->
  <div id="heartbeat" class="unknown" aria-label="heart rate">
    <div class="hb-row">
      <svg class="hb-heart" viewBox="0 0 32 29" aria-hidden="true">
        <defs><linearGradient id="hb-red" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#e0574c"/><stop offset="1" stop-color="#8e1a16"/>
        </linearGradient></defs>
        <path d="M16 28 C10 23 1.5 17 1.5 9.2 1.5 4.6 5 1.5 9 1.5 12.2 1.5 14.6 3.4 16 6 17.4 3.4 19.8 1.5 23 1.5 27 1.5 30.5 4.6 30.5 9.2 30.5 17 22 23 16 28Z"/>
      </svg>
      <span class="hb-num">--</span><span class="hb-unit">BPM</span>
    </div>
    <div class="hb-trace"><div class="bar"><div class="track"><canvas width="326" height="22"></canvas></div></div></div>
  </div>
  <span id="levelnum" class="hidden">1</span>

  <!-- ============================ vicinity ad ========================= -->
  <!-- "Download Vicinity" QR (https://onelink.to/p74svv) in the left bar.
       config.yaml overlay.vicinity_ad: false hides it. -->
  <div id="vicinity-ad">
    <img class="va-qr" src="./assets/vicinity-qr.png" width="198" height="198"
         alt="QR code: download Vicinity" />
    <div class="va-text">
      <span class="va-pre">Download</span>
      <span class="va-name">Vicinity</span>
      <span class="va-sub">scan to get the app</span>
    </div>
  </div>

  <!-- ============================ vtube avatar ======================== -->
  <div id="avatar-wrap">
    <canvas id="ring" width="360" height="360"></canvas>
    <canvas id="avatar" width="300" height="380"></canvas>
    <!-- 3D VRM avatar; replaces the 2D one when WebGL + the model load -->
    <canvas id="avatar3d" width="440" height="330" class="hidden"></canvas>
  </div>

  <!-- ============================ thu'um meter ====================== -->
  <div id="thuum">
    <span class="th-name" id="thuum-name">Fus Ro Dah</span>
    <span class="th-bar"><i id="thuum-fill"></i></span>
  </div>

  <!-- ============================ gesture menu ======================== -->
  <div id="menu" class="hidden"></div>

  <!-- ============================ privacy badge ======================== -->
  <!-- Mirrors autoclip's face-blur switch. Set data-autoclip to wherever
       your autoclip REST server runs (default port 8899). -->
  <div id="privacy" class="hidden" data-autoclip="http://127.0.0.1:8899">
    <span class="pv-dot"></span><span class="pv-text">faces blurred</span>
  </div>

  <div id="status" class="hidden"></div>

  <!-- ============================ vicinity chat ======================== -->
  <!-- Read-only mirror of what the Meta Ray-Ban Display is showing: the
       phone pushes the view model to the vicinity relay and this panel draws
       it. Set data-relay to wherever relay/server.py runs (default 8901).
       data-hide-stale="false" keeps the panel up when the phone drops off. -->
  <div id="vicinity" class="hidden" data-relay="http://127.0.0.1:8901"></div>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
