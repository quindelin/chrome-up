; software display; off on GPU VMs, which draw on the host's GPU X server (:0)
[program:xvfb]
startretries=30
autostart=%(ENV_XVFB_AUTOSTART)s
command=/usr/bin/Xvfb :99 -screen 0 1920x1080x24 -nolisten tcp
priority=10
autorestart=true

[program:pulse]
startretries=30
command=/usr/bin/pulseaudio --system=false --exit-idle-time=-1 --disallow-exit -n --load="module-null-sink sink_name=obs" --load="module-native-protocol-unix"
user=obs
environment=HOME="/home/obs"
priority=15
autorestart=true

[program:obs]
startretries=30
command=/usr/local/bin/start-obs
user=obs
environment=HOME="/home/obs",DISPLAY="%(ENV_DISPLAY)s"
priority=20
autorestart=true
startsecs=5

; OBS UI over VNC, bound to localhost: reach it with ./gcp.sh tunnel
[program:x11vnc]
startretries=30
command=/usr/bin/x11vnc -display %(ENV_DISPLAY)s -forever -shared -nopw -localhost -rfbport 5900 -quiet
priority=30
autorestart=true

[program:novnc]
startretries=30
command=/usr/bin/websockify --web /usr/share/novnc 127.0.0.1:6080 127.0.0.1:5900
priority=40
autorestart=true
