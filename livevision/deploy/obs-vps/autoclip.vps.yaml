# autoclip on the streaming VPS: merged over the repo's autoclip.yaml by
# setup.sh into autoclip.yaml (next to this file), mounted as config.vps.yaml.
# ${VAR} is expanded by autoclip at load time from the container env (.env).

# Clips are cut from OBS's composited program (HUD + avatar), so a short looks
# like the stream. One feed does both jobs: the program's audio is the glasses
# audio (OBS's Glasses media source), so Whisper and scoring see the same voice,
# and analysis + render share one timeline with nothing to sync. While OBS isn't
# publishing live/program the source drops to the raw glasses feed, and the
# render's hud_stack falls back to a centre crop for that portrait input.
source:
  mode: rtmp
  rtmp:
    url: "rtmp://127.0.0.1:1935/live"
    stream_key: program                # OBS's composited program
    fallback_key: "${STREAM_KEY}"      # the raw glasses feed (no HUD)
    mediamtx_api: "http://127.0.0.1:9997"
    recheck_seconds: 30
    dir: var/autoclip/incoming
    chunk_seconds: 30

render:
  layout: hud_stack                    # camera / compass + vitals + avatar

obs:
  password: "${OBS_WS_PASSWORD}"
  auto_start_replay_buffer: false      # rtmp mode never uses the replay buffer
  # "show lingualens" / "hide lingualens": OBS owns visibility of the LinguaLens
  # panel only (the HUD keeps every other show/hide). Nothing else is enabled.
  voice:
    enabled: true
    intents: [show, hide, toggle]
    visibility_sources: [LinguaLens]
    aliases:                           # how Whisper tends to hear it
      lingualens: LinguaLens
      lingua lens: LinguaLens
      lingo lens: LinguaLens
      linguist lens: LinguaLens
      language lens: LinguaLens
      language: LinguaLens
      language app: LinguaLens
      lesson: LinguaLens
      chinese: LinguaLens
      japanese: LinguaLens

# "go live on twitch" restreams OBS's composited program (HUD + avatar), which
# OBS publishes to MediaMTX at live/program. Turn on with AUTOCLIP_LIVE_STREAMS=1
# in .env and put TWITCH_STREAM_KEY / YOUTUBE_STREAM_KEY / ... there too.
live_streams:
  enabled: false                       # setup.sh: AUTOCLIP_LIVE_STREAMS
  source: "rtmp://127.0.0.1:1935/live/program"

analysis:
  transcribe_model: tiny               # CPU is shared with OBS x264 + Chromium

retention:
  keep_windows: 2
  clip_hours: 48
  max_clips_gb: 1.5                    # 40 GB disk; a 30 s 1080x1920 clip is ~20-30 MB
  # program chunks (6 Mbps NVENC) keep ~6 min on disk (~270 MB) plus 2 windows
  # (~450 MB): the same footprint class as the raw feed, never both at once

publish:
  mode: dry_run                        # setup.sh: AUTOCLIP_PUBLISH (dry_run | live)
  require_approval: true

# GET /api/autoclip/stack, polled by the iOS companion app (companion/ios)
stack:
  mediamtx_api: "http://127.0.0.1:9997"
  ingest_path: "live/${STREAM_KEY}"
  program_path: "live/program"

server:
  host: 127.0.0.1                      # Caddy proxies /autoclip/*; the overlay reads :8899
  port: 8899
  root_path: /autoclip
  public_base_url: "https://${DOMAIN}/autoclip"   # DOMAIN follows the boot's IP
