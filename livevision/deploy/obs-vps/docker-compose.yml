# The IRL streaming box: phone/glasses -> MediaMTX -> OBS (+ Skyrim HUD) -> MediaMTX live/program -> Twitch/YouTube.
# + autoclip (clips, approval queue, multi-platform restream).
# Brought up by setup.sh on the VM; everything uses host networking and the
# GCP firewall decides what is reachable (80/443, 1935/tcp, 8890/udp only).

services:
  mediamtx:
    image: bluenviron/mediamtx:1.15.1
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./mediamtx.yml:/mediamtx.yml:ro

  hud:
    build:
      context: ../..
      dockerfile: deploy/obs-vps/hud/Dockerfile
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./hud.yaml:/app/config.vps.yaml:ro
      - hud-data:/app/data
    # no mic on a VPS: audio (lip-sync, speech skills, shouts) and vision
    # both read the glasses feed back out of MediaMTX - see hud.yaml
    command: ["python", "-m", "server.main", "--config", "config.vps.yaml", "--host", "127.0.0.1"]
    environment:
      OPENCV_FFMPEG_CAPTURE_OPTIONS: "rtsp_transport;tcp"   # vision reads the feed over RTSP

  obs:
    build: ./obs
    restart: unless-stopped
    network_mode: host
    shm_size: 1gb                    # Chromium (browser source) needs it
    # only what OBS reads, not the whole .env: compose recreates a container
    # when its environment changes, and a new title or clip-posting token
    # restarting OBS cut the stream (compose fills these in from .env)
    environment:
      STREAM_KEY: ${STREAM_KEY:-}
      SRT_PASSPHRASE: ${SRT_PASSPHRASE:-}
      OBS_WS_PASSWORD: ${OBS_WS_PASSWORD:-}
      OUT_SERVER: ${OUT_SERVER:-}
      OUT_KEY: ${OUT_KEY:-}
      OBS_AUTOSTREAM: ${OBS_AUTOSTREAM:-}
      LINGUALENS_URL: ${LINGUALENS_URL:-}
      OUT_WIDTH: ${OUT_WIDTH:-}
      OUT_HEIGHT: ${OUT_HEIGHT:-}
      OUT_FPS: ${OUT_FPS:-}
      OUT_KBPS: ${OUT_KBPS:-}
    volumes:
      - obs-config:/home/obs/.config/obs-studio

  # clip pipeline + approval API: reads the raw glasses feed back out of
  # MediaMTX, restreams OBS's program on voice ("go live on twitch").
  autoclip:
    build:
      context: ../..
      dockerfile: deploy/obs-vps/autoclip/Dockerfile
    restart: unless-stopped
    network_mode: host
    env_file: .env
    cpus: 1.5                        # + nice 15 in the image: never starve OBS
    volumes:
      - ./autoclip.yaml:/app/config.vps.yaml:ro
      - autoclip-data:/app/var       # clips, outbox, state, whisper model

  caddy:
    image: caddy:2.8
    restart: unless-stopped
    network_mode: host
    environment:                     # the Caddyfile's three, as for OBS
      DOMAIN: ${DOMAIN:-}
      AUTOCLIP_USER: ${AUTOCLIP_USER:-}
      AUTOCLIP_PASS_HASH: ${AUTOCLIP_PASS_HASH:-}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data

volumes:
  hud-data:
  obs-config:
  caddy-data:
  autoclip-data:
