# ----------------------------------------------------------------------------------
# MediaMTX — public RTMP ingest that the phone app pushes to.
#
# This config is deliberately minimal. The phone publishes to:
#
#   rtmp://<host>:1935/live/<STREAM_KEY>
#
# and autoclip subscribes to the *same* URL as a viewer. MediaMTX relays the
# bytes; no recording, no HLS, no auth beyond the unguessable stream key.
#
# In production, put this behind TLS (e.g. a Caddy / nginx reverse proxy doing
# `rtmp:// -> rtmps://` is not native, so use SRT or WHIP for encryption) and
# set `authMethod: internal` plus a users list. See https://mediamtx.org/docs.
# ----------------------------------------------------------------------------------

logLevel: info
api: no
metrics: no
playback: no

# RTMP listener for the phone.
rtmpAddress: :1935

paths:
  # rtmp://host:1935/live/<name>  -> any name, anyone can publish.
  # We rely on the <name> being a long random secret (see RTMP_STREAM_KEY).
  live:
    source: publisher
