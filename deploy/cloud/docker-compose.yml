name: autoclip-cloud

services:
  mediamtx:
    image: bluenviron/mediamtx:v1.10.0
    restart: unless-stopped
    network_mode: host               # simplest: phone reaches the host's :1935
    volumes:
      - ./mediamtx.yml:/mediamtx.yml:ro
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "1935"]
      interval: 10s
      timeout: 3s
      retries: 5

  autoclip:
    build: .
    restart: unless-stopped
    depends_on:
      mediamtx:
        condition: service_healthy
    network_mode: host               # lets autoclip talk to mediamtx on :1935
    env_file:
      - .env
    environment:
      PYTHONUNBUFFERED: "1"
      # Force the cloud source driver; the rest of the config lives in autoclip.yaml.
      AUTOCLIP_SOURCE_MODE: rtmp
    volumes:
      # persistent state: outbox, workdir, logs
      - autoclip-data:/app/var
    command: ["python", "-m", "autoclip", "loop", "--every", "30"]

volumes:
  autoclip-data:
